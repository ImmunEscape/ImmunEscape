<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ImmunEscape — éliminez le microbe</title><style>body{font:18px system-ui,sans-serif;background:#edf4f3;color:#183b40;margin:0}main{max-width:680px;margin:32px auto;padding:24px;background:white;border-radius:16px}button{display:block;width:100%;padding:16px;margin:12px 0;text-align:left;font:inherit;background:#edf4f3;border:1px solid #9ab7b5;border-radius:10px;cursor:pointer}button:disabled{cursor:default}#feedback{padding:16px;line-height:1.5}strong{color:#176b56}h1{font-size:24px} @media(max-width:730px){main{margin:12px}}</style></head><body><main><h1>IMMUNESCAPE</h1><p id="station"></p><h2 id="question"></h2><div id="choices"></div><div id="feedback" role="status" aria-live="polite"></div></main><script>
const stations=[
{title:'Arrivée par les airs',q:'M. tuberculosis présente des PAMP riches en glucides. Quelle famille de récepteurs peut reconnaître ces motifs ?',a:['RLR — récepteurs de type RIG-I','CLR — lectines de type C','NLR — récepteurs de type NOD'],ok:1,letter:'M',why:['Les RLR reconnaissent principalement des ARN.','Certaines lectines de type C reconnaissent des motifs glucidiques microbiens.','Les NLR sont des récepteurs intracellulaires ; les CLR sont ici la réponse attendue.'],hint:'Cherchez le lieu où les bacilles rencontrent les macrophages pulmonaires.'},
{title:'Le poumon : macrophage infecté',q:'Des macrophages ont reconnu M. tuberculosis. Que se passe-t-il ?',a:['Ils produisent des anticorps spécifiques.','Ils phagocytent et éliminent systématiquement le bacille.','Ils phagocytent le bacille, mais n’arrivent pas toujours à l’éliminer et ont besoin d’aide.'],ok:2,letter:'É',why:['Les anticorps sont sécrétés par les plasmocytes.','Le bacille peut survivre dans les macrophages.','Le bacille peut persister dans les macrophages ; les lymphocytes T contribuent à leur activation.'],hint:'Suivez la voie empruntée par les cellules dendritiques vers le ganglion : la lymphe.'},
{title:'La lymphe : cellule dendritique',q:'Quel phénotype permet à une cellule dendritique mature de rejoindre le ganglion et d’activer un lymphocyte T naïf ?',a:['CMH élevé, CD80/CD86 élevés, CCR7 absent','Expression élevée de PRR uniquement','CMH élevé, CD80/CD86 élevés et CCR7 exprimé'],ok:2,letter:'M',why:['CCR7 contribue à la migration vers le ganglion.','Les PRR seuls ne suffisent pas à activer un lymphocyte T naïf.','CCR7 guide la migration ; les complexes peptide-CMH et la costimulation participent à l’activation des lymphocytes T.'],hint:'Cherchez le lieu de rencontre des cellules dendritiques et des lymphocytes T naïfs.'},
{title:'Ganglion : activation des lymphocytes T',q:'Quelle différenciation lymphocytaire produit la cytokine qui aide le macrophage à combattre M. tuberculosis ?',a:['Th2, production d’IL-5','Th1, production d’IFNγ','Tr1, production de TGFβ'],ok:1,letter:'O',why:['L’IL-5 intervient notamment dans les réponses éosinophiliques.','L’IFNγ produit par les Th1 favorise les fonctions antimicrobiennes des macrophages.','Les Tr1 sont surtout associés à la production d’IL-10 et à la régulation immunitaire.'],hint:'Empruntez la circulation sanguine pour rejoindre le poumon.'},
{title:'Le sang : vers le poumon',q:'De quoi dépend principalement l’entrée du lymphocyte T effecteur dans le poumon inflammatoire ?',a:['D’un code associant récepteurs de chimiokines et molécules d’adhérence','De cytokines et de lipides inflammatoires uniquement','Du TCR et du CMH uniquement'],ok:0,letter:'I',why:['Les chimiokines et les molécules d’adhérence contribuent au recrutement des lymphocytes.','Les médiateurs inflammatoires seuls ne suffisent pas à expliquer le recrutement.','Le TCR reconnaît le peptide-CMH, mais cela ne suffit pas à expliquer le recrutement.'],hint:'Retournez vers le poumon, où les macrophages infectés attendent l’aide des lymphocytes T.'},
{title:'Retour au poumon : action de l’IFNγ',q:'Quel mécanisme antimicrobien l’IFNγ peut-il renforcer dans un macrophage infecté ?',a:['Production de perforine','Production d’histamine','Production de dérivés réactifs de l’oxygène et de l’azote'],ok:2,letter:'R',why:['La perforine est notamment produite par les lymphocytes cytotoxiques et les cellules NK.','L’histamine est notamment libérée par les mastocytes.','L’IFNγ peut renforcer les fonctions antimicrobiennes, dont la production de dérivés réactifs ; le rôle du NO est particulièrement établi chez la souris.'],hint:'Cherchez le centre de la mémoire immunitaire.'},
{title:'Le centre de la mémoire',q:'Quelle population conserve la mémoire de la réponse lymphocytaire T antituberculeuse ?',a:['Des plasmocytes','Des cellules dendritiques','Des lymphocytes T mémoire'],ok:2,letter:'E',why:['Les plasmocytes sécrètent des anticorps.','Les cellules dendritiques présentent des antigènes.','Les lymphocytes T mémoire peuvent persister et participer à une réponse ultérieure.'],hint:'Reconstituez le mot mystère avec les sept lettres collectées et présentez-le à votre enseignant.'}
];
const n=Number(new URLSearchParams(location.search).get('s'));const el=id=>document.getElementById(id);if(!Number.isInteger(n)||n<1||n>7){el('question').textContent='Scannez le QR code de votre station pour commencer.';}else{const s=stations[n-1];el('station').textContent=`Station ${n}/7 — ${s.title}`;el('question').textContent=s.q;s.a.forEach((a,i)=>{const b=document.createElement('button');b.textContent='ABC'[i]+'. '+a;b.onclick=()=>{const f=el('feedback');f.replaceChildren();const p=document.createElement('p');p.textContent=(i===s.ok?'Bonne réponse ! ':'Réessayez. ')+s.why[i];f.append(p);if(i===s.ok){const l=document.createElement('strong');l.textContent='Lettre à collecter : '+s.letter;f.append(l);const h=document.createElement('p');h.textContent=s.hint;f.append(h);el('choices').querySelectorAll('button').forEach(x=>x.disabled=true);}};el('choices').append(b);});}
</script></body></html>
